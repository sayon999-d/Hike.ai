services:
  - type: web
    name: hike-ai
    runtime: python
    plan: free
    branch: main
    rootDir: main
    buildCommand: python -m pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn unified_ai:app --host 0.0.0.0 --port 8000
    autoDeploy: true
    numInstances: 1
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hike-db
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CHUTES_API_KEY
        sync: false
      - key: BYTEZ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BACKEND_URL
        fromService:
          name: hike-ai
          type: web
          property: host

databases:
  - name: hike-db
    databaseName: hike_ai
    user: hike_user
    plan: free
    ipAllowList: []
