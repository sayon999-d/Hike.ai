services:
  - type: web
    name: hike-ai
    runtime: python
    plan: free
    branch: main
    rootDir: backend/main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn unified_ai:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    numInstances: 1
    healthCheckPath: /
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///unified_ai.db
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BYTEZ_API_KEY
        sync: false
      - key: CHUTES_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://hike-ai.onrender.com/auth/google/callback
      - key: BACKEND_URL
        value: https://hike-ai.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MAX_OUTPUT_TOKENS
        value: "150"
      - key: MAX_QUERY_LENGTH
        value: "2000"
      - key: FETCH_INTERVAL
        value: "60"
